[package]
name = "epaint_gtk_gui"
version = "0.2.0"
edition = "2024"

[features]
default = []
paints_have_ids = []
taegeted_mixtures = []
palette_samples = []

[dependencies]

gtk3_ext = { git = "http://github.com/pwil3058/rs_pw_gix" }

colour_math = { path = "../colour_math" }
colour_math_derive = { path = "../colour_math_derive" }

[dependencies.epaint]
path = "../epaint"
features = ["targeted_mixtures", "paints_have_ids"]

[dependencies.epaint_gtk]
path = "../epaint_gtk"
features = ["targeted_mixtures", "palette_samples", "paints_have_ids"]
#features = ["palette_samples"]
