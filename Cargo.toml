[workspace]

resolver = "2"

members = [
    "colour_math",
    "colour_math_cairo",
    "colour_math_derive",
    "colour_math_gtk",
    "colour_math_gui_gtk",
    "epaint",
    "epaint_derive",
    "epaint_gtk",
    "epaint_gtk_gui",
    "wpca_gtk",
    "mcmmtk_gtk",
]

[workspace.dependencies]
gtk3_ext = { git = "https://github.com/pwil3058/rs_pw_gix" }
path_utilities = { git = "https://github.com/pwil3058/rust_utilities" }
recollections = { git = "https://github.com/pwil3058/rust_utilities" }
